[project]
name = "promptvault"
version = "0.1.0"
description = "A personal CLI tool for storing, tagging, and retrieving resuable AI prompts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click==8.4.2"
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.1",
    "black==26.5.1",
    "ruff==0.16.0",
    "mypy==2.3.0"
]

[project.scripts]
promptvault = "promptvault.cli:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptvault*"]
